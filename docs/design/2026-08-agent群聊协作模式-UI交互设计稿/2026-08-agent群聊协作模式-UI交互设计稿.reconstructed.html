控件<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-UX-002/003 · REQ-PRIM-003<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">消息与内容<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">Human/Agent 同屏、reply 引用与定位、结构化 @Human/@Agent、附件预览/下载/OCR、编辑版本链、撤回 tombstone、Agent correction、长消息折叠<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">上传失败、不可解析、reply 目标已撤回、编辑不得改寻址、503 重试同 key<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-MSG-001～010 · REQ-UX-007<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">Agent 协作<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">profile / 职责 / participation active·on-mention、availability ready·busy·paused·noauth、单消息多 Agent 并发、accepted·running·preview·completed·failed·cancelled<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">provider timeout 有界 attempt、手动 retry 谱系、scoped preemption、stale event 丢弃、source revised、memory degraded<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-AGT-001～010 · REQ-MEM-010 · REQ-MSG-008<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">项目推进<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">唯一 active Goal、Decision proposed/confirmed/superseded、Request pending/accepted/transfer、NextAction 全生命周期与验收、Blocker open/deferred/cannot_answer、Ball 多 source<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">并发确认 409、Agent 不得自确认/自验收、离群责任冲突清单、reviewAt 回到 open<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-PRJ-001～013 · REQ-ROOM-003 · REQ-UX-004<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">Memory<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">五类记忆、steward watermark、proposal/confirmed/disputed、来源消息与附件引用、点击来源回时间线、Room 内检索<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">disputed 暂停注入、steward 降级、来源已撤回显示 tombstone、不做跨 Room 搜索<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-MEM-001～007 · REQ-UX-004<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">工具安全<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">read-only 自动执行、side-effect 逐次确认（目标/参数/影响/可逆/有效期/一次性）、confirmed→grant→claim→dispatched<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">参数变更失效、expired、permission denied/noauth、claim 前 revoke 显示「未执行」、outcome_unknown review 三种闭合<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-AGT-011/012/013 · REQ-PRIM-018<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">通知<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">flat durable recipient-scoped center、Room badge、mention/Request/confirmation/due/tool result/Agent 完成失败、read 与 handled 分离、深链<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">来源不可访问安全失败、撤权停止投递并清本地项、无 OS push、无五分区 inbox<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-UX-008 · REQ-PRJ-012<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">Settings drawer<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">Human invitation 与 Agent assignment 两条独立流程、owner/admin/member 权限态、职责/participation/availability/tool grants、归档·重开·ownership transfer<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">loading、ACK、401/403/409/429/503、离群未完成责任冲突清单、焦点归还<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-UX-005 · REQ-ROOM-002/003/004 · REQ-ID-004<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.55fr) minmax(0,1fr) 176px;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">可访问性<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">完整键盘路径、可预测焦点顺序、drawer/dialog 焦点归还、控件名称与状态、非颜色区分、reduced motion<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">preview 使用 aria-live=off + 产品态摘要播报；最小窗口核心动作不进溢出菜单<\u002Fspan><span style=\"padding:11px 12px;font:500 10.5px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">REQ-UX-009 · FCV1-A11Y<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;overflow:hidden\">\n      <div style=\"padding:13px 14px;background:#f8fafc;border-bottom:1px solid #cbd5e1;display:flex;gap:10px;align-items:center\"><strong style=\"font-size:12.5px\">FT-16 可访问性验证矩阵<\u002Fstrong><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#64748b\">REQ-UX-009 · 通过条件必须逐项留证<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1.1fr) minmax(0,1.45fr) minmax(0,1fr);font-size:11px;line-height:1.6\">\n        <strong style=\"padding:10px 12px;border-bottom:1px solid #eef1f5\">键盘 / 焦点<\u002Fstrong><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#334155\">macOS 全键盘访问开启；不用指针完成 J-01～J-07<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#475569\">Tab 顺序与视觉顺序一致；dialog/drawer 圈定焦点；关闭后回到触发器；Esc 不绕过确认<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#027a48\">0 个焦点陷阱；核心动作均有可见 focus ring<\u002Fspan>\n        <strong style=\"padding:10px 12px;border-bottom:1px solid #eef1f5\">缩放 / 重排<\u002Fstrong><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#334155\">1440×900：100% / 125% / 150% / 200%；840×560：100% / 125% / 150%<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#475569\">消息、Request、execution、confirmation、错误与恢复动作不裁切；允许区域滚动，禁止双轴页面滚动<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#027a48\">文本不重叠；核心动作不进不可发现溢出菜单<\u002Fspan>\n        <strong style=\"padding:10px 12px;border-bottom:1px solid #eef1f5\">对比度 / 非颜色<\u002Fstrong><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#334155\">默认、hover、focus、disabled、error、degraded、selected 全状态<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#475569\">正文/小字 ≥ 4.5:1；大字 ≥ 3:1；控件边界与焦点 ≥ 3:1；状态同时使用图标、文本或线型<\u002Fspan><span style=\"padding:10px 12px;border-bottom:1px solid #eef1f5;color:#027a48\">Human/Agent、success/error 不依赖颜色单独识别<\u002Fspan>\n        <strong style=\"padding:10px 12px\">动效 / 通告<\u002Fstrong><span style=\"padding:10px 12px;color:#334155\">系统 Reduce Motion 开 / 关；VoiceOver 验证状态变化<\u002Fspan><span style=\"padding:10px 12px;color:#475569\">reduced motion 下无位移动画；preview `aria-live=off`；仅 accepted/failed/completed/cancelled 等低频产品态用克制通告<\u002Fspan><span style=\"padding:10px 12px;color:#027a48\">无模拟 typing；无高频 chunk 播报；通告含对象与恢复动作<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #84adff;border-radius:10px;background:#eef4ff;padding:14px 16px;display:flex;gap:14px;align-items:center\">\n      <div style=\"display:grid;gap:4px\"><strong style=\"font-size:12.5px;color:#1e3a8a\">103 条 PRD Requirement 已逐项索引<\u002Fstrong><span style=\"font-size:11px;line-height:1.6;color:#334155\">本页保留场景级矩阵；逐 ID 分类为设计页面/交互、非视觉协议约束、批准边界或冲突处理，且不使用范围缩写。<\u002Fspan><\u002Fdiv>\n      <a href=\"../design-requirement-coverage.md\" style=\"margin-left:auto;padding:7px 10px;border:1px solid #1d4ed8;border-radius:5px;background:#fff;font:700 11px/1 inherit;white-space:nowrap\">打开逐项 Requirement 覆盖矩阵 →<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:9px\">\n      <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">明确未设计（本次范围之外）<\u002Fspan>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px\">\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">Web / 原生移动端<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">OS push<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">跨 Room 五分区工作台<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">全局搜索<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">完整 Blueprint UI<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">多 Provider / BYOK<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">独立 Thread<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">音视频 / 网盘 / 组织架构 / 审批流<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">社交 reaction / 详细 read receipt / @all<\u002Fspan>\n        <span style=\"padding:5px 9px;border:1px dashed #94a3b8;border-radius:5px;color:#475569\">永久删除 UI<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">375px 窄窗不作为移动端或响应式验收证据（GAP-023）。最小支持窗口为 840×560 桌面窗口。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vHandoff }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"工程交接\" style=\"padding:28px 32px 72px;max-width:1504px;margin:0 auto;display:grid;gap:20px\">\n    <div style=\"display:grid;gap:5px\">\n      <h2 style=\"margin:0;font-size:16px;font-weight:700\">工程交接注释<\u002Fh2>\n      <p style=\"margin:0;max-width:900px;font-size:12.5px;line-height:1.7;color:#475569\">每个交互标明权威来源。凡是没有服务端事件或状态机支撑的点击效果，都必须标为 <span style=\"font:600 11px/1 ui-monospace,Menlo,monospace\">prototype-only<\u002Fspan>，界面不得显示「已生效」。<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);background:#f8fafc;border-bottom:1px solid #cbd5e1;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#475569\"><span style=\"padding:11px 12px\">用户动作<\u002Fspan><span style=\"padding:11px 12px\">本地暂态<\u002Fspan><span style=\"padding:11px 12px\">server ACK<\u002Fspan><span style=\"padding:11px 12px\">stable event / projection<\u002Fspan><span style=\"padding:11px 12px\">错误恢复动作<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">发送消息<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">submitting；保留正文/附件/引用；禁用重复提交<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">message.accepted（requestId 匹配）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">message.created + 逐 target intent outcome；按 messageId/eventId 去重<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">429/503/超时 → 保留输入，重试用同一 idempotency key（30 天窗口内重放原结果）<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">@Agent 调用<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">无独立暂态；随消息提交。preview chunk 为可丢弃本地显示<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">逐 target accepted / rejected<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">invocation.accepted → execution.running → completed/failed/cancelled（各自独立）<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">failed → 手动 retry 创建 retryOfExecutionId 新 execution；来源已撤回/Context 已争议 → 拒绝旧 snapshot<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">@Human Request 接受<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">按钮 submitting；卡片保持 pending 外观<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">request.accepted（仅 target 本人 session）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">nextaction/openquestion 原子创建；Ball projection 迁移到新 source<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">409 已取消/已转交 → 载入最新状态并说明；不静默成功<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">副作用确认<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">按钮 submitting；参数区冻结显示，任何变化即作废<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">confirmation.confirmed（绑定 execution/attempt/toolCall/参数/principal/session，一次消费）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">grant active → claimed / revoked / expired；toolcall.dispatched<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">expired/参数变更/403 → 重新发起调用；claim 前 revoke → 显示「未执行」；claim 后异常 → outcome_unknown review<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">确认 Decision<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">按钮 submitting；proposal 仍为虚线轨<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">decision.confirmed（具名 confirmer）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">confirmed fact + memory 更新 + 受影响对象提示<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">并发确认只成功一个，另一端 409 并显示当前权威结论<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">点击通知深链<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">高亮与滚动位置为纯本地视图状态<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">notification.read（不改变 handled）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">handled 由 source 对象状态投影<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">来源不可访问 → 安全失败，不泄露标题与正文，本地项清除<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);border-bottom:1px solid #eef1f5;font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">邀请 Human / 配置 Agent<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">按钮 submitting；表单保留<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">invitation.created / assignment.updated（含版本）<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">membership 仅在接受后创建；assignment 立即生效并写审计<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">401 重新登录 · 403 权限说明 · 409 载入最新版本 · 429 冷却 · 503 保留输入重试<\u002Fspan><\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);font-size:11.5px;line-height:1.6\"><span style=\"padding:11px 12px;font-weight:700\">离线 → 重连<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">离线只读横幅；所有写入禁用，不进入队列<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">重连后 sync（连续 cursor）或 repair<\u002Fspan><span style=\"padding:11px 12px;color:#334155\">固定 watermark 重建 revision/项目/Ball/invocation/confirmation/notification<\u002Fspan><span style=\"padding:11px 12px;color:#475569\">repair 失败 → 保留完整旧 cache；未接受的操作由用户显式重试，旧 confirmation 不自动执行<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px\">\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:8px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">prototype-only 清单<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;font-size:11.5px;line-height:1.8;color:#334155\">\n          <li>本设计稿的所有步进按钮（上一步 / 下一步 / 路径选择）仅用于演示状态迁移。<\u002Fli>\n          <li>卡片内的「确认 / 接受 / 重试」在原型中直接推进视图，实现时必须等待匹配 requestId 的权威 ACK。<\u002Fli>\n          <li>示例中的 ID（exec 8f21、toolCall 4c11、room-2041）为占位，不代表真实数据。<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:8px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">实现时必须验证的三条硬边界<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;font-size:11.5px;line-height:1.8;color:#334155\">\n          <li>Agent 的任何项目结论只能落为 proposal；confirmed 必须带具名 Human confirmer。<\u002Fli>\n          <li>side-effect 的成功只能来自 dispatch 证据；不确定即 <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">outcome_unknown<\u002Fspan>，且不提供 generic retry。<\u002Fli>\n          <li>三栏渲染必须取自同一 roomId 的 projection；切换 Room 时原子替换，不允许任一栏保留上一个 Room 的数据。<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script data-props=\"{&quot;showAnnotations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;设计稿&quot;},&quot;showMinWindow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;设计稿&quot;}}\">\nconst D = {\n  view: 'shell', auth: '', net: 'online', cmp: 'idle', req: '', e1: '', e2: '',\n  conf: '', attach: '', notifSync: '', dec: 'proposed', notif: false, hl: false,\n  ann: ['—', '—', '—', '—', '—']\n};\n\nconst J = {\n  1: { label: 'J-01 登录 / 入群', req: 'REQ-ID-002 / 003 · REQ-UX-006', steps: [\n    { view:'auth', auth:'restore', note:'客户端启动：先校验 session 与离线租约，再决定是否解密 cache。不得先闪现未授权内容。',\n      ann:['启动应用','恢复中骨架，无 Room 内容','session.verify 结果','—','校验失败 → 登录 / 锁定'] },\n    { view:'auth', auth:'login', note:'session 已在另一设备被撤销 → 401。本地 cache 锁定，需重新认证。',\n      ann:['提交密码','submitting，保留输入','login ACK 建立本设备 session family','session.created','401 凭据错误 / 429 限流 → 保留输入重试'] },\n    { view:'auth', auth:'invite', note:'定向邀请与 AI 可见性披露必须在接受之前呈现；接受是显式动作。',\n      ann:['点击接受邀请','按钮 submitting','invitation.accepted','membership.c
