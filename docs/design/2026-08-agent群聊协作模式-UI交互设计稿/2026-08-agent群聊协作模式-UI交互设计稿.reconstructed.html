  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>原生人机协作 IM · macOS Desktop UI 交互设计稿<\u002Ftitle>\n<script src=\"bfc4680c-1e35-446d-a3a6-f8e50d4be2c1\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin:0; background:#eceff2; }\n  *,*::before,*::after { box-sizing:border-box; }\n  a { color:#175cd3; text-decoration:none; border-bottom:1px solid #b9d0f5; }\n  a:hover { color:#0f3f95; border-bottom-color:#175cd3; }\n  button:focus-visible, [tabindex]:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #2563eb; outline-offset:2px; }\n  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<template id=\"__bundler_thumbnail\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect width=\"200\" height=\"200\" fill=\"#1f2937\"><\u002Frect><rect x=\"60\" y=\"66\" width=\"6\" height=\"68\" rx=\"3\" fill=\"#5b21b6\"><\u002Frect><circle cx=\"94\" cy=\"82\" r=\"14\" fill=\"#eef4ff\"><\u002Fcircle><rect x=\"80\" y=\"106\" width=\"28\" height=\"28\" rx=\"8\" fill=\"#84adff\"><\u002Frect><rect x=\"118\" y=\"72\" width=\"22\" height=\"20\" rx=\"4\" fill=\"#f8fafc\"><\u002Frect><rect x=\"118\" y=\"112\" width=\"22\" height=\"16\" rx=\"4\" fill=\"#94a3b8\"><\u002Frect><\u002Fsvg><\u002Ftemplate>\n\n<div style=\"min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;color:#1f2937;-webkit-font-smoothing:antialiased\">\n\n  <header style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:24px;padding:14px 32px;background:#ffffff;border-bottom:1px solid #cbd5e1\">\n    <div style=\"display:grid;gap:2px\">\n      <div style=\"font-size:14px;font-weight:700;letter-spacing:-0.01em\">原生人机协作 IM · macOS Desktop UI 交互设计稿<\u002Fdiv>\n      <div style=\"font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b;letter-spacing:.04em\">PRD 证据重建版 v0.1 已批准基线 · FT-16 Design Contract · 2026-08<\u002Fdiv>\n    <\u002Fdiv>\n    <nav aria-label=\"设计稿分区\" style=\"display:flex;gap:6px;margin-left:auto\">\n      <button type=\"button\" onClick=\"{{ goProto }}\" style=\"padding:7px 12px;border:1px solid #1f2937;border-radius:6px;background:#1f2937;color:#fff;font:600 12px/1 inherit;cursor:pointer\">交互原型<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goStates }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 12px/1 inherit;cursor:pointer\">状态分支<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goTokens }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 12px/1 inherit;cursor:pointer\">设计令牌<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goComponents }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 12px/1 inherit;cursor:pointer\">组件状态<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goCoverage }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 12px/1 inherit;cursor:pointer\">覆盖矩阵<\u002Fbutton>\n      <button type=\"button\" onClick=\"{{ goHandoff }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 12px/1 inherit;cursor:pointer\">工程交接<\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ vProto }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"交互原型\" style=\"padding:28px 32px 72px\">\n\n    <div style=\"display:flex;gap:20px;align-items:flex-start;max-width:1504px;margin:0 auto 20px;padding:16px 18px;background:#fff;border:1px solid #cbd5e1;border-radius:10px\">\n      <div style=\"display:grid;gap:10px;min-width:0;flex:1\">\n        <div style=\"font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#64748b\">核心原型路径<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <button type=\"button\" onClick=\"{{ pick1 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-01 登录 / 入群 → 进入 Room<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick2 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-02 发消息 → ACK / 失败重试<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick3 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-03 @Agent → execution → final<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick4 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-04 @Human → Request → 接受 / 转交<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick5 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-05 副作用 → 精确确认 → 结果<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick6 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-06 proposal → 确认 → 项目事实<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ pick7 }}\" style=\"padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1.3 inherit;color:#1f2937;cursor:pointer;text-align:left\">J-07 通知深链 / 离线 → repair<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;align-self:stretch;background:#e2e8f0\"><\u002Fdiv>\n      <div style=\"width:400px;display:grid;gap:8px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font:600 12px/1 inherit;color:#0f172a\">{{ jLabel }}<\u002Fspan>\n          <span style=\"font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b\">{{ stepLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;line-height:1.6;color:#334155;min-height:38px;text-wrap:pretty\">{{ stepNote }}<\u002Fp>\n        <div style=\"display:flex;gap:6px\">\n          <button type=\"button\" onClick=\"{{ prev }}\" style=\"padding:7px 12px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;font:600 12px/1 inherit;color:#1f2937;cursor:pointer\">上一步<\u002Fbutton>\n          <button type=\"button\" onClick=\"{{ next }}\" style=\"padding:7px 14px;border:1px solid #1d4ed8;border-radius:5px;background:#1d4ed8;color:#fff;font:600 12px/1 inherit;cursor:pointer\">下一步 →<\u002Fbutton>\n          <span style=\"font:500 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b;align-self:center\">{{ jReq }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 默认窗口 1440 × 900 ============ -->\n    <div style=\"max-width:1504px;margin:0 auto\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:8px\">\n        <h2 style=\"margin:0;font-size:13px;font-weight:700\">默认窗口 1440 × 900<\u002Fh2>\n        <span style=\"font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b\">REQ-UX-002 · 三栏原子指向同一 roomId<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"width:1440px;height:900px;background:#f8fafc;border:1px solid #94a3b8;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgb(15 23 42 / 14%);display:grid;grid-template-rows:38px minmax(0,1fr)\">\n\n        <div style=\"display:flex;align-items:center;gap:8px;padding:0 12px;background:#eef1f5;border-bottom:1px solid #d7dee7\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#e5695f\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#e0b34a\"><\u002Fspan>\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#61bd5c\"><\u002Fspan>\n          <span style=\"margin-left:10px;font-size:12px;font-weight:600;color:#475569\">原生人机协作 IM<\u002Fspan>\n          <span style=\"margin-left:auto;font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b\">单租户私有部署 · SQLite 权威<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- 启动与身份 -->\n        <sc-if value=\"{{ vAuth }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"启动与身份\" style=\"display:grid;place-items:center;padding:40px;min-height:0\">\n          <div style=\"width:560px;display:grid;gap:16px\">\n\n            <sc-if value=\"{{ aRestore }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;display:grid;gap:14px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"width:26px;height:26px;border-radius:7px;background:#1f2937;display:grid;place-items:center;color:#fff;font:700 11px/1 ui-monospace,Menlo,monospace\">IM<\u002Fspan>\n                <span style=\"font-size:15px;font-weight:700\">正在恢复会话<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:4px;border-radius:2px;background:#e2e8f0;overflow:hidden\"><span style=\"display:block;width:38%;height:100%;background:#1d4ed8\"><\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:13px;line-height:1.7;color:#475569;text-wrap:pretty\">校验 session 与离线授权租约。<strong style=\"font-weight:700\">在校验通过前不显示任何 Room 内容<\u002Fstrong>，避免闪现未授权缓存。<\u002Fp>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px dotted #64748b;color:#475569\">LOCAL 暂态<\u002Fspan>\n                <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px solid #cbd5e1;color:#475569\">REQ-UX-006<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aLogin }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;display:grid;gap:16px\">\n              <div style=\"display:grid;gap:6px\">\n                <span style=\"font-size:16px;font-weight:700\">登录<\u002Fspan>\n                <span style=\"font-size:12px;color:#64748b\">邀请绑定的密码账户 · 每台设备独立可撤销 session family<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;padding:10px 12px;border-left:3px solid #b54708;background:#fffaf0;border-radius:0 6px 6px 0\">\n                <span style=\"font:700 10px/1.6 ui-monospace,Menlo,monospace;color:#b54708\">401<\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.6;color:#7c4a08\">此设备的 session 已被撤销。本地加密 cache 已锁定，重新认证且仍有权限后可恢复。<\u002Fspan>\n              <\u002Fdiv>\n              <label style=\"display:grid;gap:6px\"><span style=\"font-size:12px;font-weight:700\">账户<\u002Fspan><input type=\"text\" value=\"chen.mo@studio.internal\" readonly=\"readonly\" style=\"min-height:38px;padding:8px 10px;border:1px solid #64748b;border-radius:6px;font:inherit;font-size:13px;background:#fff\" /><\u002Flabel>\n              <label style=\"display:grid;gap:6px\"><span style=\"font-size:12px;font-weight:700\">密码<\u002Fspan><input type=\"password\" value=\"0123456789\" readonly=\"readonly\" style=\"min-height:38px;padding:8px 10px;border:1px solid #64748b;border-radius:6px;font:inherit;font-size:13px;background:#fff\" /><\u002Flabel>\n              <button type=\"button\" onClick=\"{{ next }}\" style=\"min-height:38px;border:1px solid #1d4ed8;border-radius:6px;background:#1d4ed8;color:#fff;font:700 13px/1 inherit;cursor:pointer\">登录<\u002Fbutton>\n              <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">Agent 没有登录入口；作者身份由服务端认证 principal 注入。<span style=\"font:600 10px/1 ui-monospace,Menlo,monospace\">REQ-ID-001 / REQ-ID-002<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aInvite }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;display:grid;gap:16px\">\n              <div style=\"display:grid;gap:6px\">\n                <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#64748b\">定向邀请 · 仅受邀账户可接受<\u002Fspan>\n                <span style=\"font-size:16px;font-weight:700\">林澈 邀请你加入 Room「归档迁移 2026Q3」<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border:1px dashed #84adff;background:#f5f8ff;border-radius:8px;padding:14px;display:grid;gap:8px\">\n                <span style=\"font-size:12px;font-weight:700;color:#175cd3\">接受后你将获得的可见性<\u002Fspan>\n                <ul style=\"margin:0;padding-left:18px;font-size:12px;line-height:1.8;color:#334155\">\n                  <li>Room 的<strong style=\"font-weight:700\">全部历史消息与附件<\u002Fstrong>，包含你加入之前的内容。<\u002Fli>\n                  <li>Room 当前有效内容默认对 Room 内 Agent 可见，包含 Agent 配置之前的历史。<\u002Fli>\n                  <li>Provider 与模型：<span style=\"font:600 11px/1 ui-monospace,Menlo,monospace\">server-side 单 Provider / 单模型<\u002Fspan>，已禁用 Provider 侧留存。<\u002Fli>\n                  <li>已撤回内容仅保留于 Human 审计与 owner 导出，不进入 Agent 检索。<\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button type=\"button\" onClick=\"{{ next }}\" style=\"min-height:38px;padding:0 16px;border:1px solid #1d4ed8;border-radius:6px;background:#1d4ed8;color:#fff;font:700 13px/1 inherit;cursor:pointer\">我已了解，接受邀请<\u002Fbutton>\n                <button type=\"button\" style=\"min-height:38px;padding:0 16px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#1f2937;font:600 13px/1 inherit;cursor:pointer\">拒绝<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">拒绝也是被记录的结果；接受前不产生半 membership。<span style=\"font:600 10px/1 ui-monospace,Menlo,monospace\">REQ-ID-003 / REQ-MSG-010<\u002Fspan><\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aCatalog }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;display:grid;gap:14px\">\n              <span style=\"font-size:15px;font-weight:700\">加载 Room catalog<\u002Fspan>\n              <div style=\"display:grid;gap:8px\">\n                <div style=\"height:44px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0\"><\u002Fdiv>\n                <div style=\"height:44px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0\"><\u002Fdiv>\n                <div style=\"height:44px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0\"><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:12px;line-height:1.7;color:#475569;text-wrap:pretty\">catalog、上次 Room 的 timeline 与 project panel <strong style=\"font-weight:700\">原子恢复<\u002Fstrong>；repair 完成前不显示\"半个 Room\"。<\u002Fp>\n              <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px solid #1f2937;color:#1f2937;width:max-content\">EVT stable event<\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aNoRoom }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"status\" style=\"background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;display:grid;gap:14px;text-align:left\">\n              <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#64748b\">EMPTY · SERVER PROJECTION<\u002Fspan>\n              <span style=\"font-size:17px;font-weight:700\">还没有可进入的 Room<\u002Fspan>\n              <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:#475569\">catalog 已完整加载，此账户当前没有 active 或 archived Room。这里不是加载中，也不会展示演示 Room。<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #1d4ed8;border-radius:6px;background:#1d4ed8;color:#fff;font:700 12px/1 inherit\">使用邀请链接加入<\u002Fbutton><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;font:600 12px/1 inherit\">刷新 catalog<\u002Fbutton><\u002Fdiv>\n              <span style=\"font:500 10px/1.6 ui-monospace,Menlo,monospace;color:#64748b\">恢复动作只发起明确 command/query；不会本地伪造 membership。<\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aDegraded }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"status\" style=\"background:#fffaf0;border:1px solid #f0c48a;border-radius:12px;padding:28px;display:grid;gap:14px\">\n              <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#b54708\">DEGRADED · CATALOG AVAILABLE<\u002Fspan>\n              <span style=\"font-size:17px;font-weight:700;color:#5c3a05\">Room 列表可用，最近 Room 暂不可恢复<\u002Fspan>\n              <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:#7c4a08\">session 有效且 catalog 已校验，但上次 Room 的 projection 不完整。保留完整旧 cache，不展示半个 Room，也不接受写入。<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #b54708;border-radius:6px;background:#b54708;color:#fff;font:700 12px/1 inherit\">重试 repair<\u002Fbutton><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;font:600 12px/1 inherit\">选择其他 Room<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ aFatal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"alert\" style=\"background:#fff5f4;border:1px solid #f0a9a3;border-radius:12px;padding:28px;display:grid;gap:14px\">\n              <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#b42318\">FATAL · FAIL CLOSED<\u002Fspan>\n              <span style=\"font-size:17px;font-weight:700;color:#8a2118\">无法安全启动工作区<\u002Fspan>\n              <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:#8a2118\">本地加密 cache 校验失败且服务端无法完成权威重建。未解密、未展示任何 Room 内容；没有永久 spinner。<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #b42318;border-radius:6px;background:#b42318;color:#fff;font:700 12px/1 inherit\">重新认证并重建 cache<\u002Fbutton><button type=\"button\" style=\"min-height:36px;padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;font:600 12px/1 inherit\">导出无正文诊断<\u002Fbutton><\u002Fdiv>\n              <span style=\"font:500 10px/1.6 ui-monospace,Menlo,monospace;color:#8a2118\">诊断只含稳定 ID、状态、大小与错误分类，不含消息/附件正文、token、secret 或隐藏推理。<\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Room 主界面 -->\n        <sc-if value=\"{{ vShell }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"Room 主界面\" style=\"display:grid;grid-template-columns:248px minmax(0,1fr) 340px;min-height:0;position:relative\">\n\n          <!-- 左栏 -->\n          <aside aria-label=\"Room 列表\" style=\"border-right:1px solid #e2e8f0;background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0\">\n            <div style=\"padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid #eef1f5\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"width:26px;height:26px;border-radius:50%;background:#1d4ed8;display:grid;place-items:center;color:#fff;font:700 11px/1 inherit\">陈<\u002Fspan>\n                <div style=\"display:grid;gap:1px;min-width:0\">\n                  <span style=\"font-size:12px;font-weight:700\">陈默<\u002Fspan>\n                  <span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#64748b\">owner · 本设备 session<\u002Fspan>\n                <\u002Fdiv>\n                <button type=\"button\" onClick=\"{{ toggleNotif }}\" aria-label=\"通知中心，3 条未读\" style=\"margin-left:auto;position:relative;width:30px;height:30px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer;display:grid;place-items:center\">\n                  <span style=\"width:12px;height:2px;background:#334155;box-shadow:0 4px 0 #334155,0 -4px 0 #334155\"><\u002Fspan>\n                  <span style=\"position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#b42318;color:#fff;font:700 10px/16px ui-monospace,Menlo,monospace;text-align:center\">3<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"overflow:auto;padding:8px\">\n              <div style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#64748b;padding:6px 8px\">ACTIVE ROOMS<\u002Fdiv>\n\n              <div aria-current=\"true\" style=\"display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:8px;background:#eef4ff;border:1px solid #d9e6ff;align-items:center\">\n                <span style=\"width:3px;height:100%;border-radius:2px;background:#1d4ed8\"><\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">归档迁移 2026Q3<\u002Fspan>\n                  <span style=\"font-size:11px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">3 Human · 2 Agent · Goal 已确认<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;gap:3px;justify-items:end\">\n                  <span style=\"min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#b42318;color:#fff;font:700 10px/17px ui-monospace,Menlo,monospace\">2<\u002Fspan>\n                  <span style=\"font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#b54708;border:1px solid #f0c48a;background:#fffaf0;border-radius:3px;padding:2px 3px\">持球<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:8px;align-items:center\">\n                <span style=\"width:3px;height:100%;border-radius:2px;background:transparent\"><\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">供应商合规审阅<\u002Fspan>\n                  <span style=\"font-size:11px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">2 Human · 1 Agent<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#e2e8f0;color:#334155;font:700 10px/17px ui-monospace,Menlo,monospace\">5<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:8px;align-items:center\">\n                <span style=\"width:3px;height:100%;border-radius:2px;background:transparent\"><\u002Fspan>\n                <div style=\"display:grid;gap:3px;min-width:0\">\n                  <span style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">内部工具试点<\u002Fspan>\n                  <span style=\"font-size:11px;color:#64748b\">1 Human · 1 Agent<\u002Fspan>\n                <\u002Fdiv>\n                <span><\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"height:1px;background:#eef1f5;margin:10px 8px\"><\u002Fdiv>\n              <button type=\"button\" style=\"width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:0;border-radius:8px;background:transparent;font:600 12px/1 inherit;color:#475569;cursor:pointer;text-align:left\">\n                <span style=\"width:14px;height:11px;border:1px solid #94a3b8;border-radius:2px;display:block\"><\u002Fspan>\n                已归档 Room（4）\n              <\u002Fbutton>\n              <p style=\"margin:6px 8px 0;font-size:10.5px;line-height:1.6;color:#94a3b8\">不设跨 Room 五分区工作台与全局搜索（DEF-001 / DEF-004）。<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"padding:10px 12px;border-top:1px solid #eef1f5;display:grid;gap:6px\">\n              <sc-if value=\"{{ netOffline }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:8px;align-items:center;padding:7px 8px;border:1px solid #cbd5e1;border-left:3px solid #b54708;border-radius:0 6px 6px 0;background:#fffaf0\">\n                <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;color:#b54708\">离线<\u002Fspan>\n                <span style=\"font-size:11px;line-height:1.5;color:#7c4a08\">只读缓存 · 租约剩 6h 12m<\u002Fspan>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ netRepair }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:8px;align-items:cent er-radius:10px;background:#fff;padding:14px;display:grid;gap:9px\">\n          <span style=\"font-size:12.5px;font-weight:700\">confirmed 后、claim 前被撤销<\u002Fspan>\n          <div style=\"padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;display:grid;gap:6px\">\n            <span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#475569\">GRANT REVOKED · 结果：未执行<\u002Fspan>\n            <span style=\"font-size:11.5px;line-height:1.65;color:#475569\">你的确认事实保持 <strong style=\"font-weight:700\">confirmed<\u002Fstrong>（不可改写），但 Room 已归档，独立 grant 已原子 revoked，父 execution cancelled，晚到的 claim 被拒。<\u002Fspan>\n            <span style=\"font-size:10.5px;color:#64748b\">措辞契约：显示「未执行」，不显示「已回滚」。<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;gap:10px\">\n      <h3 style=\"margin:0;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">E · 通知 / 治理 / 异步错误<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:12px\">\n\n        <article style=\"border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:14px;display:grid;gap:9px\">\n          <span style=\"font-size:12.5px;font-weight:700\">read 与 handled 分离<\u002Fspan>\n          <div style=\"display:grid;gap:7px;font-size:11.5px;line-height:1.6\">\n            <div style=\"display:flex;gap:8px;padding:9px 10px;border:1px solid #d9e6ff;border-left:3px solid #1d4ed8;border-radius:0 7px 7px 0;background:#f7faff\"><span style=\"color:#0f172a;font-weight:600;flex:1\">未读 · 未处理<\u002Fspan><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace;color:#175cd3\">unread<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;padding:9px 10px;border:1px solid #e2e8f0;border-radius:7px\"><span style=\"color:#334155;flex:1\">已读 · 仍未处理（责任未清）<\u002Fspan><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace;color:#b54708\">needs action<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;padding:9px 10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;opacity:.8\"><span style=\"color:#475569;flex:1\">已处理（source 对象已终结）<\u002Fspan><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace;color:#027a48\">handled<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">handled 由 source 对象状态投影，不能靠读通知清除；按 (recipient, source boundary, type) 幂等。<\u002Fp>\n        <\u002Farticle>\n\n        <article style=\"border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:14px;display:grid;gap:9px\">\n          <span style=\"font-size:12.5px;font-weight:700\">异步动作的五态（统一契约）<\u002Fspan>\n          <div style=\"display:grid;gap:6px\">\n            <div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:11.5px\"><span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#64748b;width:104px;flex:none\">IDLE<\u002Fspan><span style=\"color:#334155\">动作可用，无暂态<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #84adff;border-radius:7px;background:#f7faff;font-size:11.5px\"><span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#175cd3;width:104px;flex:none\">SUBMITTING<\u002Fspan><span style=\"color:#1e3a8a\">禁用重复提交，保留输入<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #a7d8c0;border-radius:7px;background:#f0fdf6;font-size:11.5px\"><span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#027a48;width:104px;flex:none\">ACCEPTED<\u002Fspan><span style=\"color:#065f46\">仅在 requestId 匹配的权威 ACK / stable event 后<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #f0c48a;border-radius:7px;background:#fffaf0;font-size:11.5px\"><span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#b54708;width:104px;flex:none\">RETRYABLE<\u002Fspan><span style=\"color:#7c4a08\">429 / 503 / 超时 — 保留输入 + 显式重试<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #f0a9a3;border-radius:7px;background:#fff5f4;font-size:11.5px\"><span style=\"font:700 9.5px/1 ui-monospace,Menlo,monospace;color:#b42318;width:104px;flex:none\">NON-RETRYABLE<\u002Fspan><span style=\"color:#8a2118\">401 / 403 / 409 / 410 — 提供修复路径而非重试<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:14px;display:grid;gap:9px\">\n          <span style=\"font-size:12.5px;font-weight:700\">Room settings 的权限与错误<\u002Fspan>\n          <div style=\"display:grid;gap:6px;font-size:11.5px;line-height:1.6\">\n            <div style=\"padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;color:#475569\"><strong style=\"font-weight:700;color:#0f172a\">member 视图<\u002Fstrong>：治理区只读，邀请与 assignment 控件禁用并说明原因，不隐藏到无从解释。<\u002Fdiv>\n            <div style=\"padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;color:#475569\"><strong style=\"font-weight:700;color:#0f172a\">admin 视图<\u002Fstrong>：可管理 member 与普通 Agent；对同级 admin 的操作被拒（403）。<\u002Fdiv>\n            <div style=\"padding:8px 10px;border:1px solid #f0c48a;border-radius:7px;background:#fffaf0;color:#7c4a08\"><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace\">429<\u002Fspan> 操作过于频繁，将在 12s 后可重试；输入保留。<\u002Fdiv>\n            <div style=\"padding:8px 10px;border:1px solid #f0a9a3;border-radius:7px;background:#fff5f4;color:#8a2118\"><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace\">403<\u002Fspan> 你不能移除同级 admin。请先由 owner 降级。<\u002Fdiv>\n            <div style=\"padding:8px 10px;border:1px solid #f0c48a;border-radius:7px;background:#fffaf0;color:#7c4a08\"><span style=\"font:700 9.5px/1.4 ui-monospace,Menlo,monospace\">503<\u002Fspan> 服务端暂不可用，配置未提交。已载入你的输入以便重试。<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vTokens }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"设计令牌\" style=\"padding:28px 32px 72px;max-width:1504px;margin:0 auto;display:grid;gap:26px\">\n\n    <div style=\"display:grid;gap:6px\">\n      <h2 style=\"margin:0;font-size:16px;font-weight:700\">设计令牌与 signature element<\u002Fh2>\n      <p style=\"margin:0;max-width:860px;font-size:12.5px;line-height:1.7;color:#475569;text-wrap:pretty\">signature element 是<strong style=\"font-weight:700\">「权威轨 + 权威印记」<\u002Fstrong>：每条消息、每张项目卡左侧 3px 竖轨的<strong style=\"font-weight:700\">线型<\u002Fstrong>表达权威等级，配合等宽小印记给出事实来源。去掉颜色后，线型与印记文字仍能区分身份与权威。其余界面保持克制：无渐变、无玻璃拟态、无拟人化装饰。<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px\">\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:12px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">SIGNATURE · 权威轨线型<\u002Fspan>\n        <div style=\"display:grid;gap:9px\">\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center\"><span style=\"height:26px;border-left:3px solid #1f2937;display:block\"><\u002Fspan><span style=\"font-size:12px;line-height:1.5\"><strong style=\"font-weight:700\">实线<\u002Fstrong> — authoritative / confirmed fact（server ACK 或 stable event）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center\"><span style=\"height:26px;border-left:3px dashed #94a3b8;display:block\"><\u002Fspan><span style=\"font-size:12px;line-height:1.5\"><strong style=\"font-weight:700\">虚线<\u002Fstrong> — proposal / pending acceptance（尚未成为事实）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center\"><span style=\"height:26px;border-left:3px dotted #64748b;display:block\"><\u002Fspan><span style=\"font-size:12px;line-height:1.5\"><strong style=\"font-weight:700\">点线<\u002Fstrong> — local transient / preview（可丢弃，不入历史）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center\"><span style=\"height:26px;border-left:3px double #475569;display:block\"><\u002Fspan><span style=\"font-size:12px;line-height:1.5\"><strong style=\"font-weight:700\">双线<\u002Fstrong> — projection（由权威对象推导，如 Ball）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:11px;align-items:center\"><span style=\"height:26px;background:repeating-linear-gradient(135deg,#fff 0 5px,#e6d3a8 5px 10px);border-left:3px solid #c99a3d;display:block\"><\u002Fspan><span style=\"font-size:12px;line-height:1.5\"><strong style=\"font-weight:700\">斜纹填充<\u002Fstrong> — disputed / outcome_unknown（需人工闭合）<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;padding-top:4px;border-top:1px solid #eef1f5\">\n          <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px dotted #64748b;color:#475569\">LOCAL<\u002Fspan>\n          <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px solid #cbd5e1;color:#475569\">ACK<\u002Fspan>\n          <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px solid #1f2937;color:#1f2937\">EVT<\u002Fspan>\n          <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px double #475569;color:#475569\">PROJ<\u002Fspan>\n          <span style=\"font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:4px 6px;border-radius:3px;border:1px dotted #64748b;color:#475569\">PREVIEW<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:12px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">身份 · 非颜色可辨<\u002Fspan>\n        <div style=\"display:grid;gap:10px\">\n          <div style=\"display:flex;gap:11px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:50%;background:#1d4ed8;display:grid;place-items:center;color:#fff;font:700 13px/1 inherit;flex:none\">陈<\u002Fspan><span style=\"font-size:12px;line-height:1.55\"><strong style=\"font-weight:700\">Human<\u002Fstrong>：圆形头像 + 气泡（左上直角）+ <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">HUMAN · role<\u002Fspan> 标签<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:center\"><span style=\"display:flex;gap:5px;flex:none;align-items:center\"><span style=\"width:3px;height:34px;border-radius:2px;background:#5b21b6\"><\u002Fspan><span style=\"width:34px;height:34px;border-radius:9px;background:#5b21b6;display:grid;place-items:center;color:#fff;font:700 13px/1 inherit\">检<\u002Fspan><\u002Fspan><span style=\"font-size:12px;line-height:1.55\"><strong style=\"font-weight:700\">Agent<\u002Fstrong>：圆角方形标识 + 职责色轨 + 无气泡正文 + <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">AGENT · 职责<\u002Fspan> 标签<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:11px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:9px;background:#5b21b6;background-image:repeating-linear-gradient(135deg,rgb(255 255 255 / 24%) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px rgb(15 23 42 / 28%);display:grid;place-items:center;color:#fff;font:700 13px/1 inherit;flex:none\">译<\u002Fspan><span style=\"font-size:12px;line-height:1.55\">第 6 个及以后的 Agent 复用色槽时叠加<strong style=\"font-weight:700\">斜纹身份图案<\u002Fstrong>，不靠颜色区分。<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">寻址：<span style=\"color:#1d4ed8;font-weight:700;border-bottom:2px dashed currentcolor\">@Human<\u002Fspan> 为虚下划线的请求（待接受）；<span style=\"padding:1px 5px;border-radius:4px;background:#5b21b6;color:#fff;font-weight:700\">@Agent<\u002Fspan> 为实心 chip 的一次真实调用。两者选择器、反馈与结果均不同。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:12px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">颜色（沿用已验证的对比度资产）<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;font:500 10px/1.5 ui-monospace,Menlo,monospace\">\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#f8fafc;border:1px solid #e2e8f0\"><\u002Fspan><span style=\"color:#475569\">app-bg #f8fafc<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#ffffff;border:1px solid #e2e8f0\"><\u002Fspan><span style=\"color:#475569\">panel #ffffff<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#e2e8f0\"><\u002Fspan><span style=\"color:#475569\">line #e2e8f0<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#1f2937\"><\u002Fspan><span style=\"color:#475569\">ink #1f2937<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#64748b\"><\u002Fspan><span style=\"color:#475569\">muted #64748b<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#1d4ed8\"><\u002Fspan><span style=\"color:#475569\">human #1d4ed8<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#eef4ff;border:1px solid #d9e6ff\"><\u002Fspan><span style=\"color:#475569\">bubble #eef4ff<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#027a48\"><\u002Fspan><span style=\"color:#475569\">success #027a48<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#b54708\"><\u002Fspan><span style=\"color:#475569\">warning #b54708<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#b42318\"><\u002Fspan><span style=\"color:#475569\">danger #b42318<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#8a5a00\"><\u002Fspan><span style=\"color:#475569\">unknown #8a5a00<\u002Fspan><\u002Fdiv>\n          <div><span style=\"display:block;height:34px;border-radius:6px;background:#2563eb\"><\u002Fspan><span style=\"color:#475569\">focus #2563eb<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font:500 10px/1.4 ui-monospace,Menlo,monospace;color:#475569\">\n          <div><span style=\"display:block;height:26px;border-radius:6px;background:#175cd3\"><\u002Fspan>role 1<\u002Fdiv>\n          <div><span style=\"display:block;height:26px;border-radius:6px;background:#5b21b6\"><\u002Fspan>role 2<\u002Fdiv>\n          <div><span style=\"display:block;height:26px;border-radius:6px;background:#a21caf\"><\u002Fspan>role 3<\u002Fdiv>\n          <div><span style=\"display:block;height:26px;border-radius:6px;background:#0e7490\"><\u002Fspan>role 4<\u002Fdiv>\n          <div><span style=\"display:block;height:26px;border-radius:6px;background:#344054\"><\u002Fspan>role 5<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">职责色槽与语义色互斥（不复用 success/warning/danger），避免「紫色 = 失败」之类的误读。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:12px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">字体与字号<\u002Fspan>\n        <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#94a3b8;width:74px;flex:none\">16 / 700<\u002Fspan><span style=\"font-size:16px;font-weight:700\">分区标题<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#94a3b8;width:74px;flex:none\">14 / 700<\u002Fspan><span style=\"font-size:14px;font-weight:700\">Room 名称 · 面板标题<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#94a3b8;width:74px;flex:none\">13 / 400<\u002Fspan><span style=\"font-size:13px\">消息正文（行高 1.65）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#94a3b8;width:74px;flex:none\">12 / 500<\u002Fspan><span style=\"font-size:12px\">项目卡与元信息<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 10px/1 ui-monospace,Menlo,monospace;color:#94a3b8;width:74px;flex:none\">10.5 mono<\u002Fspan><span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em\">STATE / 印记 / ID<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">正文使用 macOS 系统字体（-apple-system / PingFang SC）；一切状态、ID 与印记使用等宽体，使「机器事实」与「人写内容」在排版上就可区分。最小可读字号 10.5px 仅用于等宽印记。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:12px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">间距 · 圆角 · 边框 · 层级<\u002Fspan>\n        <div style=\"display:grid;gap:7px;font-size:11.5px;line-height:1.6;color:#334155\">\n          <div>间距梯度 <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">4 · 6 · 8 · 10 · 12 · 14 · 18 · 24<\u002Fspan>（栏内 padding 12–20，时间线行距 14）<\u002Fdiv>\n          <div>圆角 <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">3<\u002Fspan> 印记 · <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">5–6<\u002Fspan> 控件 · <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">8–10<\u002Fspan> 卡片 · <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">0 12 12<\u002Fspan> Human 气泡 · <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">8<\u002Fspan> Agent 方形标识<\u002Fdiv>\n          <div>边框 1px 为主；语义强调用 3px 左轨，Agent assignment 用 6px 左轨<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">层级：<span style=\"padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;background:#fff\">0 面板<\u002Fspan><span style=\"padding:5px 8px;border:1px solid #94a3b8;border-radius:6px;background:#fff;box-shadow:0 8px 20px rgb(15 23 42 / 12%)\">20 popover<\u002Fspan><span style=\"padding:5px 8px;border:1px solid #94a3b8;border-radius:6px;background:#fff;box-shadow:-10px 0 24px rgb(15 23 42 / 16%)\">30 drawer<\u002Fspan><\u002Fdiv>\n          <div>焦点环：<span style=\"display:inline-block;padding:4px 8px;border-radius:5px;border:1px solid #cbd5e1;outline:3px solid #2563eb;outline-offset:2px\">3px #2563eb / offset 2<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:10px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">状态语义（唯一词表）<\u002Fspan>\n        <div style=\"display:grid;gap:5px;font-size:11.5px;line-height:1.55\">\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#475569\">ACCEPTED<\u002Fspan><span style=\"color:#334155\">已接受，尚未开始生成（含 queued）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#334155\">RUNNING<\u002Fspan><span style=\"color:#334155\">正在处理（含 waiting_confirmation，必须给出行动入口）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#027a48\">COMPLETED<\u002Fspan><span style=\"color:#334155\">权威 final 已提交（≠ 项目建议已被确认）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#b42318\">FAILED<\u002Fspan><span style=\"color:#334155\">错误终态，附原因 / 影响 / 恢复动作<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#475569\">CANCELLED<\u002Fspan><span style=\"color:#334155\">Human 取消或被 supersede，独立终态，不计失败<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#8a5a00\">OUTCOME_UNKNOWN<\u002Fspan><span style=\"color:#334155\">已 dispatch 结果不明，禁止自动重试，需 review 闭合<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#475569\">PROPOSAL<\u002Fspan><span style=\"color:#334155\">提议，未生效<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#027a48\">CONFIRMED<\u002Fspan><span style=\"color:#334155\">具名 Human 确认的项目事实（含 confirmer / 来源 / 版本）<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#b54708\">DISPUTED<\u002Fspan><span style=\"color:#334155\">已被 Human 争议，暂停注入 Agent context<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px\"><span style=\"font:700 10px/1.5 ui-monospace,Menlo,monospace;color:#64748b\">SUPERSEDED<\u002Fspan><span style=\"color:#334155\">被新结论取代，保留双向链<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:11px;line-height:1.6;color:#64748b\">禁用词：「已读」不得表达 Agent judgement；「正在输入」不得用于 Agent；「已回滚」不得用于已 dispatch 的副作用。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:16px;display:grid;gap:10px\">\n        <span style=\"font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#475569\">动效与可访问性令牌<\u002Fspan>\n        <div style=\"display:grid;gap:6px;font-size:11.5px;line-height:1.65;color:#334155\">\n          <div>过渡仅用于 popover / drawer 的 120ms 位移与 80ms 淡入；状态变化不使用循环动画。<\u002Fdiv>\n          <div>运行态使用<strong style=\"font-weight:700\">静态图标 + 文字<\u002Fstrong>（▶ RUNNING），不使用打字点、脉冲或旋转球。<\u002Fdiv>\n          <div><span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">prefers-reduced-motion<\u002Fspan>：全部过渡降至 0.01ms，进度条改为静态百分比文字。<\u002Fdiv>\n          <div>aria-live 策略：时间线容器 <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">polite / additions<\u002Fspan>；preview 容器 <span style=\"font:600 10.5px/1 ui-monospace,Menlo,monospace\">aria-live=off<\u002Fspan>，仅在产品态迁移（accepted→running→终态）时播报一次简短摘要，不逐 token 轰炸读屏。<\u002Fdiv>
